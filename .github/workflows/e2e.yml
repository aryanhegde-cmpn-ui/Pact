name: E2E Tests

# Parked. There are no E2E specs yet -- `e2e/` holds only its README -- so on
# every pull request this workflow spent several minutes installing Chromium in
# order to report "no tests found" and fail. Manual dispatch keeps the job
# runnable and reviewable while it has nothing to run.
#
# Restore the `pull_request` trigger together with the first spec. `e2e/README.md`
# lists what else that needs: a `webServer` block, and a decision about whether
# CI gets a MongoDB service.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Build Next.js app
        env:
          SKIP_ENV_VALIDATION: '1'
        run: npm run build

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
